ght="700">倍率 ＝ 1 ＋ R ÷ r</text><rect x="20" y="270" width="480" height="100" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260" y="298" font-size="16" fill="#1A1F24" text-anchor="middle" font-weight="700">分流器 r/5 → 6倍　　倍率器 4r → 5倍</text><text x="260" y="330" font-size="15" fill="#1A1F24" text-anchor="middle">50kΩ の電圧計を 20倍に</text><text x="260" y="356" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">R ＝ 50k × (20 − 1) ＝ 950kΩ</text></svg>