<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="20" width="460" height="50" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260.0" y="51.65" font-size="19" fill="#1A1F24" text-anchor="middle" font-weight="700">波長（m）＝ 300 ÷ 周波数（MHz）</text><rect x="24" y="85" width="140" height="44" rx="8" fill="#FFF6E5" stroke="#1A1F24" stroke-width="2.5"/><text x="94.0" y="111.9" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">10m</text><text x="178" y="112.0" font-size="15" fill="#1A1F24" text-anchor="start">300 ÷ 10 ＝ 30MHz</text><rect x="24" y="139" width="140" height="44" rx="8" fill="#FFF6E5" stroke="#1A1F24" stroke-width="2.5"/><text x="94.0" y="165.9" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">7MHz 半波長</text><text x="178" y="166.0" font-size="15" fill="#1A1F24" text-anchor="start">43m の半分 ≒ 21m</text><rect x="24" y="193" width="140" height="44" rx="8" fill="#FFF6E5" stroke="#1A1F24" stroke-width="2.5"/><text x="94.0" y="219.9" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">28MHz 放射器</text><text x="178" y="220.0" font-size="15" fill="#1A1F24" text-anchor="start">10.7m の半分 ≒ 5m</text><rect x="30" y="260" width="460" height="110" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="260" y="290" font-size="15" fill="#2F6DB5" text-anchor="middle" font-weight="700">放射電力 ＝ 電流² × 73Ω（半波長ダイポール）</text><text x="260" y="322" font-size="15" fill="#1A1F24" text-anchor="middle">10W にするには I ＝ √(10÷73) ≒ 0.37A</text><text x="260" y="352" font-size="15" fill="#1A1F24" text-anchor="middle">0.2A なら P ＝ 0.04 × 73 ≒ 3W</text></svg>