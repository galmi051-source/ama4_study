<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="20" y="30" width="200" height="50" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="120.0" y="60.25" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">ニッケルカドミウム</text><text x="240" y="62" font-size="20" fill="#C8463D" text-anchor="start" font-weight="700">1.2V</text><text x="330" y="62" font-size="13" fill="#66727F" text-anchor="start">充放電できる・大電流</text><rect x="20" y="92" width="200" height="50" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="120.0" y="122.25" font-size="15" fill="#66727F" text-anchor="middle">マンガン乾電池</text><text x="240" y="124" font-size="20" fill="#66727F" text-anchor="start" font-weight="700">1.5V</text><text x="330" y="124" font-size="13" fill="#66727F" text-anchor="start">充電できない</text><rect x="20" y="154" width="200" height="50" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="120.0" y="184.25" font-size="15" fill="#66727F" text-anchor="middle">鉛蓄電池</text><text x="240" y="186" font-size="20" fill="#66727F" text-anchor="start" font-weight="700">2V</text><text x="330" y="186" font-size="13" fill="#66727F" text-anchor="start">車のバッテリー</text><rect x="20" y="216" width="200" height="50" rx="8" fill="#fff" stroke="#2F6DB5" stroke-width="2.5"/><text x="120.0" y="246.25" font-size="15" fill="#2F6DB5" text-anchor="middle">リチウムイオン</text><text x="240" y="248" font-size="20" fill="#2F6DB5" text-anchor="start" font-weight="700">約3.7V</text><text x="330" y="248" font-size="13" fill="#66727F" text-anchor="start">継ぎ足し充電できる</text><text x="260" y="300" font-size="14" fill="#C8463D" text-anchor="middle">ニカド：放電終止電圧 1.0V・内部抵抗が小さい</text><rect x="30" y="320" width="460" height="50" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="260.0" y="349.9" font-size="14" fill="#2F6DB5" text-anchor="middle">同じ乾電池を並列 → 使用時間を長くする（電圧はそのまま）</text></svg>