<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="140" y="40" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">前もって 許可 が必要</text><rect x="30" y="60" width="220" height="70" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="140.0" y="90.75" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">無線設備の</text><text x="140.0" y="111.15" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">設置場所を変える</text><rect x="30" y="145" width="220" height="70" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="140.0" y="175.75" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">無線設備の</text><text x="140.0" y="196.15" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">変更の工事</text><text x="140" y="245" font-size="15" fill="#C8463D" text-anchor="middle">＝ 設備をいじる・動かす</text><text x="380" y="40" font-size="20" fill="#66727F" text-anchor="middle" font-weight="700">許可ではない</text><text x="380" y="85" font-size="16" fill="#66727F" text-anchor="middle">免許人の氏名の変更（届出）</text><text x="380" y="125" font-size="16" fill="#66727F" text-anchor="middle">無線局の運用の休止</text><text x="380" y="165" font-size="16" fill="#66727F" text-anchor="middle">無線局の廃止（届出）</text><text x="380" y="205" font-size="16" fill="#66727F" text-anchor="middle">免許状の訂正</text><line x1="270" y1="60" x2="270" y2="240" stroke="#D9DEE3" stroke-width="2"/><text x="260" y="330" font-size="16" fill="#1A1F24" text-anchor="middle">「許可が必要なのはどれか」→ 上の 2 つのどちらか</text></svg>