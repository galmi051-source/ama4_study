<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><line x1="40" y1="250" x2="480" y2="250" stroke="#1A1F24" stroke-width="3"/><rect x="120" y="100" width="280" height="150" fill="#EAF6EE" stroke="#2E9E62" stroke-width="2"/><text x="260" y="90" font-size="15" fill="#2E9E62" text-anchor="middle" font-weight="700">動作することを許された周波数帯（バンド）</text><polygon points="200,250 240,150 280,250" fill="#2F6DB5" opacity="0.8"/><line x1="200" y1="275" x2="280" y2="275" stroke="#2F6DB5" stroke-width="2"/><polygon points="280.0,275.0 267.1,280.5 267.1,269.5" fill="#2F6DB5"/><line x1="280" y1="275" x2="200" y2="275" stroke="#2F6DB5" stroke-width="2"/><polygon points="200.0,275.0 212.9,269.5 212.9,280.5" fill="#2F6DB5"/><text x="240" y="300" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">占有周波数帯幅</text><text x="240" y="135" font-size="16" fill="#2F6DB5" text-anchor="middle" font-weight="700">OK</text><polygon points="370,250 400,150 430,250" fill="#C8463D" opacity="0.8"/><text x="430" y="135" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">はみ出し ✕</text><text x="260" y="350" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">幅の分まで含めてバンドの中に収める</text><text x="260" y="380" font-size="16" fill="#C8463D" text-anchor="middle">穴埋め：「占有する［周波数帯幅］」</text></svg>