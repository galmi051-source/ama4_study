<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="0" y="250" width="520" height="40" fill="#E8EDF2"/><line x1="60" y1="250" x2="60" y2="160" stroke="#1A1F24" stroke-width="3"/><line x1="46" y1="160" x2="74" y2="160" stroke="#1A1F24" stroke-width="3"/><line x1="51" y1="170" x2="69" y2="170" stroke="#1A1F24" stroke-width="3"/><line x1="460" y1="250" x2="460" y2="160" stroke="#1A1F24" stroke-width="3"/><line x1="446" y1="160" x2="474" y2="160" stroke="#1A1F24" stroke-width="3"/><line x1="451" y1="170" x2="469" y2="170" stroke="#1A1F24" stroke-width="3"/><line x1="70" y1="165" x2="450" y2="165" stroke="#C8463D" stroke-width="3"/><polygon points="450.0,165.0 437.1,170.5 437.1,159.5" fill="#C8463D"/><text x="260" y="155" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">A：直接波</text><path d="M70 175 L 260 248 L 450 175" fill="none" stroke="#2F6DB5" stroke-width="3"/><text x="260" y="230" font-size="15" fill="#2F6DB5" text-anchor="middle" font-weight="700">B：大地反射波</text><text x="260" y="40" font-size="15" fill="#66727F" text-anchor="middle">VHF は見通し距離内（電離層は突き抜け）</text><rect x="20" y="300" width="230" height="70" rx="8" fill="#EAF6EE" stroke="#2E9E62" stroke-width="2.5"/><text x="135.0" y="331.5" font-size="14" fill="#2E9E62" text-anchor="middle" font-weight="700">アンテナを高く</text><text x="135.0" y="348.3" font-size="14" fill="#2E9E62" text-anchor="middle" font-weight="700">→ 見通し距離が延びる</text><rect x="270" y="300" width="230" height="70" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="385.0" y="331.5" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">✕ 放射角を高角度にする</text><text x="385.0" y="348.3" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">（空へ逃げる）</text></svg>