<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="60" y="60" width="90" height="170" rx="40" fill="#fff" stroke="#1A1F24" stroke-width="3"/><rect x="150" y="110" width="18" height="50" rx="4" fill="#C8463D"/><text x="185" y="140" font-size="16" fill="#C8463D" text-anchor="start" font-weight="700">PTT</text><text x="105" y="260" font-size="15" fill="#66727F" text-anchor="middle">マイク</text><rect x="270" y="60" width="220" height="60" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="380.0" y="96.3" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">押す → 送信状態</text><text x="380" y="140" font-size="14" fill="#1A1F24" text-anchor="middle">アンテナが送信機に接続</text><rect x="270" y="170" width="220" height="50" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="380.0" y="200.6" font-size="16" fill="#1A1F24" text-anchor="middle">離す → 受信状態</text><rect x="30" y="300" width="460" height="70" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260" y="328" font-size="15" fill="#1A1F24" text-anchor="middle">擬似負荷（ダミーロード）の目的</text><text x="260" y="356" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">調整中に電波を外部に出さないため</text></svg>