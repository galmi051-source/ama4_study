<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="30" width="460" height="120" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260" y="62" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">電波の質</text><text x="260" y="98" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">周波数の偏差及び幅</text><text x="260" y="130" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">高調波の強度　等</text><text x="260" y="185" font-size="15" fill="#66727F" text-anchor="middle" font-weight="700">電波の質ではないもの</text><rect x="30" y="205" width="108" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="84.0" y="231.2" font-size="12" fill="#66727F" text-anchor="middle">変調度</text><rect x="148" y="205" width="108" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="202.0" y="231.2" font-size="12" fill="#66727F" text-anchor="middle">信号対雑音比</text><rect x="266" y="205" width="108" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="320.0" y="231.2" font-size="12" fill="#66727F" text-anchor="middle">空中線電力の偏差</text><rect x="384" y="205" width="108" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="438.0" y="231.2" font-size="12" fill="#66727F" text-anchor="middle">電波の型式</text><rect x="30" y="285" width="460" height="80" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="260.0" y="321.0" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">適合しないと → 臨時に電波の発射の停止</text><text x="260.0" y="340.2" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">→ 臨時検査</text></svg>