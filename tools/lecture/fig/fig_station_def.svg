<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="40" y="40" width="440" height="100" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="260" y="70" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">無線局 ＝ 無線設備 ＋ 操作する者（総体）</text><text x="260" y="100" font-size="17" fill="#1A1F24" text-anchor="middle">ただし 受信のみを目的とするものは含まない</text><text x="260" y="125" font-size="14" fill="#66727F" text-anchor="middle">（設備だけでなく人も含む）</text><rect x="40" y="160" width="440" height="80" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="260" y="190" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">無線設備 ＝ 電波を送り、又は受けるための電気的設備</text><text x="260" y="218" font-size="14" fill="#66727F" text-anchor="middle">（人は含まない）</text><rect x="40" y="260" width="440" height="80" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="260" y="290" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">送信設備 ＝ 送信装置 ＋ 送信空中線系</text><text x="260" y="318" font-size="14" fill="#66727F" text-anchor="middle">（電波を送る設備）</text><text x="260" y="380" font-size="16" fill="#C8463D" text-anchor="middle">「設備＋人」なら無線局、「設備だけ」なら無線設備</text></svg>