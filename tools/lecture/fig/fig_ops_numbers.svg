<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="40" width="120" height="50" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="90.0" y="71.65" font-size="19" fill="#C8463D" text-anchor="middle" font-weight="700">3 分</text><text x="165" y="71" font-size="14" fill="#1A1F24" text-anchor="start">応答がないとき、呼出しを再開するまであける間隔</text><rect x="30" y="106" width="120" height="50" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="90.0" y="137.65" font-size="19" fill="#C8463D" text-anchor="middle" font-weight="700">10 分</text><text x="165" y="137" font-size="14" fill="#1A1F24" text-anchor="start">長時間の送信中、「こちらは」＋自局の呼出符号を送る間隔</text><rect x="30" y="172" width="120" height="50" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="90.0" y="203.65" font-size="19" fill="#2F6DB5" text-anchor="middle" font-weight="700">直ちに</text><text x="165" y="203" font-size="14" fill="#1A1F24" text-anchor="start">通信上の誤りを知ったときの訂正</text><rect x="30" y="238" width="120" height="50" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="90.0" y="269.65" font-size="19" fill="#2F6DB5" text-anchor="middle" font-weight="700">反復</text><text x="165" y="269" font-size="14" fill="#1A1F24" text-anchor="start">反復を求めるとき：「反復」の次に箇所を示す</text><rect x="30" y="304" width="120" height="50" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="90.0" y="335.65" font-size="19" fill="#2F6DB5" text-anchor="middle" font-weight="700">さようなら</text><text x="165" y="335" font-size="14" fill="#1A1F24" text-anchor="start">通信が終了したとき</text></svg>