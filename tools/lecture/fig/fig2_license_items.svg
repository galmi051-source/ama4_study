<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="20" width="250" height="350" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="3"/><text x="155" y="52" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">無線局免許状</text><text x="50" y="90" font-size="14" fill="#1A1F24" text-anchor="start">・免許人の氏名・住所</text><text x="50" y="124" font-size="14" fill="#1A1F24" text-anchor="start">・無線局の種別・目的</text><text x="50" y="158" font-size="14" fill="#1A1F24" text-anchor="start">・通信の相手方・通信事項</text><text x="50" y="192" font-size="14" fill="#1A1F24" text-anchor="start">・無線設備の設置場所</text><text x="50" y="226" font-size="14" fill="#1A1F24" text-anchor="start">・免許の有効期間</text><text x="50" y="260" font-size="14" fill="#1A1F24" text-anchor="start">・呼出符号</text><text x="50" y="294" font-size="14" fill="#1A1F24" text-anchor="start">・電波の型式・周波数</text><text x="50" y="328" font-size="14" fill="#1A1F24" text-anchor="start">・空中線電力・運用許容時間</text><text x="400" y="60" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">書かれない</text><rect x="300" y="90" width="200" height="60" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="400.0" y="125.95" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">空中線の型式</text><rect x="300" y="170" width="200" height="60" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="400.0" y="205.95" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">無線従事者の資格</text><text x="400" y="260" font-size="13" fill="#66727F" text-anchor="middle">人の資格は</text><text x="400" y="280" font-size="13" fill="#66727F" text-anchor="middle">免許証のほう</text></svg>