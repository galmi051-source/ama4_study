<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><line x1="40" y1="200" x2="480" y2="200" stroke="#1A1F24" stroke-width="3"/><rect x="40" y="150" width="110" height="50" fill="#2E9E62" opacity="0.85"/><text x="95.0" y="183" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">10W</text><text x="95.0" y="230" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">8MHz 以下</text><text x="95.0" y="252" font-size="12" fill="#66727F" text-anchor="middle">1.9・3.5・7 MHz帯</text><rect x="150" y="150" width="110" height="50" fill="#66727F" opacity="0.25"/><text x="205.0" y="183" font-size="26" fill="#C8463D" text-anchor="middle" font-weight="700">✕</text><text x="205.0" y="230" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">8〜21MHz</text><text x="205.0" y="252" font-size="12" fill="#66727F" text-anchor="middle">10・14・18 MHz帯</text><rect x="260" y="150" width="80" height="50" fill="#2E9E62" opacity="0.85"/><text x="300.0" y="183" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">10W</text><text x="300.0" y="230" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">21〜30MHz</text><text x="300.0" y="252" font-size="12" fill="#66727F" text-anchor="middle">21・24・28 MHz帯</text><rect x="340" y="150" width="140" height="50" fill="#C8463D" opacity="0.85"/><text x="410.0" y="183" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">20W</text><text x="410.0" y="230" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">30MHz 超</text><text x="410.0" y="252" font-size="12" fill="#66727F" text-anchor="middle">50・144・430 MHz帯</text><line x1="150" y1="140" x2="150" y2="205" stroke="#1A1F24" stroke-width="2"/><text x="150" y="130" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">8MHz</text><line x1="260" y1="140" x2="260" y2="205" stroke="#1A1F24" stroke-width="2"/><text x="260" y="130" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">21MHz</text><line x1="340" y1="140" x2="340" y2="205" stroke="#1A1F24" stroke-width="2"/><text x="340" y="130" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">30MHz</text><text x="260" y="60" font-size="22" fill="#1A1F24" text-anchor="middle" font-weight="700">4アマの操作範囲</text><text x="260" y="92" font-size="15" fill="#C8463D" text-anchor="middle">20W は 30MHz 超だけ。10・14・18MHz 帯は操作できない</text><text x="260" y="320" font-size="16" fill="#66727F" text-anchor="middle">モールス符号による通信操作は含まれない</text></svg>