<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><polygon points="80,150 180,70 280,150" fill="#1A1F24"/><rect x="100" y="150" width="160" height="120" fill="#fff" stroke="#1A1F24" stroke-width="3"/><rect x="140" y="190" width="80" height="50" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="180.0" y="220.25" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">免許状</text><text x="180" y="300" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">無線設備の常置場所</text><text x="180" y="322" font-size="13" fill="#66727F" text-anchor="middle">（ふだん無線機を置いてある所）</text><rect x="340" y="170" width="140" height="60" rx="10" fill="#66727F"/><rect x="365" y="140" width="80" height="40" rx="8" fill="#66727F"/><circle cx="370" cy="235" r="14" fill="#1A1F24"/><circle cx="450" cy="235" r="14" fill="#1A1F24"/><line x1="410" y1="140" x2="410" y2="100" stroke="#1A1F24" stroke-width="3"/><text x="410" y="300" font-size="16" fill="#1A1F24" text-anchor="middle">移動運用</text><text x="410" y="322" font-size="13" fill="#66727F" text-anchor="middle">免許状を持ち歩く必要はない</text><text x="260" y="375" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">移動するアマチュア局の免許状 → 常置場所に備え付け</text></svg>