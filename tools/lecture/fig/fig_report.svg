<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="60" width="190" height="70" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="125.0" y="90.75" font-size="17" fill="#1A1F24" text-anchor="middle">非常通信を</text><text x="125.0" y="111.15" font-size="17" fill="#1A1F24" text-anchor="middle">行った</text><rect x="30" y="170" width="190" height="70" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="125.0" y="200.75" font-size="17" fill="#1A1F24" text-anchor="middle">違反して運用する</text><text x="125.0" y="221.15" font-size="17" fill="#1A1F24" text-anchor="middle">無線局を見つけた</text><line x1="220" y1="95" x2="300" y2="145" stroke="#C8463D" stroke-width="3"/><polygon points="300.0,145.0 286.2,142.8 292.0,133.5" fill="#C8463D"/><line x1="220" y1="205" x2="300" y2="160" stroke="#C8463D" stroke-width="3"/><polygon points="300.0,160.0 291.4,171.1 286.1,161.6" fill="#C8463D"/><rect x="300" y="110" width="190" height="90" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="395.0" y="149.5" font-size="22" fill="#C8463D" text-anchor="middle" font-weight="700">総務大臣に</text><text x="395.0" y="175.9" font-size="22" fill="#C8463D" text-anchor="middle" font-weight="700">報告</text><text x="260" y="290" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">報告先はいつも総務大臣</text><text x="260" y="325" font-size="13" fill="#66727F" text-anchor="middle">✕ 警察署　✕ 市町村長　✕ 都道府県知事　✕ 中央防災会議会長</text><text x="260" y="360" font-size="13" fill="#66727F" text-anchor="middle">宇宙無線通信・国際通信・試験の通信は報告不要</text></svg>