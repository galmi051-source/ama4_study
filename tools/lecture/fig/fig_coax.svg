<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="260" y="60" font-size="44" fill="#1A1F24" text-anchor="middle" font-weight="700">5 D - 2 V</text><rect x="228" y="22" width="40" height="52" rx="6" fill="none" stroke="#C8463D" stroke-width="3"/><line x1="248" y1="100" x2="248" y2="130" stroke="#C8463D" stroke-width="3"/><polygon points="248.0,130.0 242.5,117.1 253.5,117.1" fill="#C8463D"/><text x="248" y="160" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">2文字目でインピーダンスが決まる</text><rect x="60" y="200" width="180" height="80" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="150.0" y="235.0" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">D ＝ 50Ω</text><text x="150.0" y="259.0" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">アマチュア無線用</text><rect x="280" y="200" width="180" height="80" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="370.0" y="235.0" font-size="20" fill="#1A1F24" text-anchor="middle">C ＝ 75Ω</text><text x="370.0" y="259.0" font-size="20" fill="#1A1F24" text-anchor="middle">テレビ用</text><text x="180" y="330" font-size="17" fill="#66727F" text-anchor="start">最初の数字（5・3）は太さの目安</text><text x="180" y="355" font-size="17" fill="#66727F" text-anchor="start">大きいほど太くて損失が少ない</text><circle cx="110" cy="340" r="26" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><circle cx="110" cy="340" r="14" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><circle cx="110" cy="340" r="4" fill="#1A1F24" stroke="#1A1F24" stroke-width="2.5"/></svg>