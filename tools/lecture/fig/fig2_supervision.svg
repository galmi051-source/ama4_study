<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="10" y="30" width="150" height="70" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="85.0" y="61.5" font-size="14" fill="#1A1F24" text-anchor="middle">電波の質が</text><text x="85.0" y="78.3" font-size="14" fill="#1A1F24" text-anchor="middle">不適合</text><line x1="160" y1="65.0" x2="180" y2="65.0" stroke="#1A1F24" stroke-width="2"/><polygon points="180.0,65.0 167.1,70.5 167.1,59.5" fill="#1A1F24"/><rect x="180" y="30" width="150" height="70" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="255.0" y="61.5" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">臨時に</text><text x="255.0" y="78.3" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">電波の発射の停止</text><line x1="330" y1="65.0" x2="350" y2="65.0" stroke="#1A1F24" stroke-width="2"/><polygon points="350.0,65.0 337.1,70.5 337.1,59.5" fill="#1A1F24"/><rect x="350" y="30" width="150" height="70" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="425.0" y="69.9" font-size="14" fill="#1A1F24" text-anchor="middle">臨時検査</text><text x="260" y="130" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">電波を発射させる検査 ＝ 電波の質又は空中線電力</text><text x="260" y="170" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">違反したとき（3か月以内の運用の停止）または制限</text><rect x="30" y="190" width="145" height="46" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="102.5" y="218.25" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">運用許容時間</text><rect x="188" y="190" width="145" height="46" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="260.5" y="218.25" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">周波数</text><rect x="346" y="190" width="145" height="46" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="418.5" y="218.25" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">空中線電力</text><text x="260" y="270" font-size="13" fill="#66727F" text-anchor="middle">✕ 電波の型式・通信の相手方・通信事項の制限</text><rect x="30" y="290" width="225" height="75" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="142.5" y="323.75" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">不正な手段</text><text x="142.5" y="341.75" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">→ 免許の取消し</text><rect x="265" y="290" width="225" height="75" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="377.5" y="324.0" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">従事者の違反</text><text x="377.5" y="340.8" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">→ 3か月以内の従事停止</text></svg>