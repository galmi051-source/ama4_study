<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="130" y="34" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">送信側</text><text x="390" y="34" font-size="20" fill="#2F6DB5" text-anchor="middle" font-weight="700">受信側</text><line x1="260" y1="20" x2="260" y2="380" stroke="#D9DEE3" stroke-width="2"/><rect x="20" y="60" width="90" height="50" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="65.0" y="90.25" font-size="15" fill="#1A1F24" text-anchor="middle">送信機</text><line x1="110" y1="85" x2="130" y2="85" stroke="#1A1F24" stroke-width="2"/><polygon points="130.0,85.0 117.1,90.5 117.1,79.5" fill="#1A1F24"/><rect x="130" y="60" width="80" height="50" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="170.0" y="92.0" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">LPF</text><line x1="210" y1="85" x2="235" y2="85" stroke="#1A1F24" stroke-width="2"/><line x1="240" y1="85" x2="240" y2="49" stroke="#1A1F24" stroke-width="3"/><line x1="226" y1="49" x2="254" y2="49" stroke="#1A1F24" stroke-width="3"/><line x1="231" y1="59" x2="249" y2="59" stroke="#1A1F24" stroke-width="3"/><text x="130" y="140" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">高調波を出さない</text><text x="30" y="180" font-size="14" fill="#1A1F24" text-anchor="start">・遮へいを厳重に</text><text x="30" y="208" font-size="14" fill="#1A1F24" text-anchor="start">・接地を完全に</text><text x="30" y="236" font-size="14" fill="#1A1F24" text-anchor="start">・正しく調整</text><text x="30" y="264" font-size="14" fill="#1A1F24" text-anchor="start">・TVアンテナから離す</text><line x1="290" y1="85" x2="290" y2="49" stroke="#1A1F24" stroke-width="3"/><line x1="276" y1="49" x2="304" y2="49" stroke="#1A1F24" stroke-width="3"/><line x1="281" y1="59" x2="299" y2="59" stroke="#1A1F24" stroke-width="3"/><line x1="290" y1="85" x2="310" y2="85" stroke="#1A1F24" stroke-width="2"/><rect x="310" y="60" width="80" height="50" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="350.0" y="92.0" font-size="20" fill="#2F6DB5" text-anchor="middle" font-weight="700">HPF</text><line x1="390" y1="85" x2="410" y2="85" stroke="#1A1F24" stroke-width="2"/><polygon points="410.0,85.0 397.1,90.5 397.1,79.5" fill="#1A1F24"/><rect x="410" y="60" width="90" height="50" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="455.0" y="90.25" font-size="15" fill="#1A1F24" text-anchor="middle">テレビ</text><text x="390" y="140" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">短波の基本波を落とす</text><text x="390" y="170" font-size="13" fill="#66727F" text-anchor="middle">TV電波（高い周波数）は通す</text><rect x="20" y="320" width="480" height="50" rx="8" fill="#fff" stroke="#C8463D" stroke-width="2.5"/><text x="260.0" y="350.25" font-size="15" fill="#C8463D" text-anchor="middle">✕ 送信側に「TV電波を通しやすいフィルタ」</text></svg>