<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="40" width="150" height="80" rx="8" fill="#fff" stroke="#2E9E62" stroke-width="2.5"/><text x="105.0" y="85.95" font-size="17" fill="#2E9E62" text-anchor="middle" font-weight="700">① 聴守</text><text x="200" y="72" font-size="16" fill="#1A1F24" text-anchor="start">その周波数で受信して</text><text x="200" y="98" font-size="16" fill="#1A1F24" text-anchor="start">混信を与えないことを確認</text><line x1="105" y1="120" x2="105" y2="150" stroke="#66727F" stroke-width="2"/><polygon points="105.0,150.0 99.5,137.1 110.5,137.1" fill="#66727F"/><rect x="30" y="150" width="150" height="80" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="105.0" y="195.95" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">② 擬似空中線回路</text><text x="200" y="182" font-size="16" fill="#1A1F24" text-anchor="start">できればダミーロードで</text><text x="200" y="208" font-size="16" fill="#1A1F24" text-anchor="start">電波を出さずに調整</text><line x1="105" y1="230" x2="105" y2="260" stroke="#66727F" stroke-width="2"/><polygon points="105.0,260.0 99.5,247.1 110.5,247.1" fill="#66727F"/><rect x="30" y="260" width="150" height="80" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="105.0" y="305.95" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">③ 試験電波</text><text x="200" y="292" font-size="16" fill="#1A1F24" text-anchor="start">「本日は晴天なり」＋呼出符号</text><text x="200" y="318" font-size="16" fill="#C8463D" text-anchor="start" font-weight="700">10 秒 を超えない</text><text x="260" y="385" font-size="13" fill="#66727F" text-anchor="middle">確かめるのは「混信を与えないこと」（他局が通信していないこと、ではない）</text></svg>