<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="140" y="45" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">無線従事者 免許証（人）</text><rect x="40" y="65" width="200" height="90" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="140.0" y="104.5" font-size="22" fill="#C8463D" text-anchor="middle" font-weight="700">10 日以内</text><text x="140.0" y="130.9" font-size="22" fill="#C8463D" text-anchor="middle" font-weight="700">に返納</text><text x="40" y="185" font-size="14" fill="#1A1F24" text-anchor="start">・免許の取消しを受けた</text><text x="40" y="209" font-size="14" fill="#1A1F24" text-anchor="start">・再交付後に見つかった</text><text x="40" y="233" font-size="14" fill="#1A1F24" text-anchor="start">・死亡／失そうの宣告</text><text x="140" y="275" font-size="14" fill="#66727F" text-anchor="middle">有効期間は無い</text><text x="380" y="45" font-size="18" fill="#2F6DB5" text-anchor="middle" font-weight="700">無線局 免許状（局）</text><rect x="280" y="65" width="200" height="90" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="380.0" y="104.5" font-size="22" fill="#2F6DB5" text-anchor="middle" font-weight="700">1 か月以内</text><text x="380.0" y="130.9" font-size="22" fill="#2F6DB5" text-anchor="middle" font-weight="700">に返納</text><text x="280" y="185" font-size="14" fill="#1A1F24" text-anchor="start">・免許が効力を失った</text><text x="280" y="209" font-size="14" fill="#1A1F24" text-anchor="start">・有効期間は 5 年</text><text x="280" y="245" font-size="14" fill="#66727F" text-anchor="start">免許記録の写しは</text><text x="280" y="265" font-size="14" fill="#66727F" text-anchor="start">返納でなく「廃棄」</text><text x="260" y="340" font-size="22" fill="#1A1F24" text-anchor="middle" font-weight="700">免許証 10 日 ／ 免許状 1 か月</text><text x="260" y="372" font-size="15" fill="#66727F" text-anchor="middle">運用停止・従事停止は 3 か月以内</text></svg>