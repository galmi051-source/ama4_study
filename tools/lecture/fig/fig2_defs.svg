<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="24" y="26" width="120" height="76" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="84.0" y="69.6" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">無線電話</text><text x="158" y="60.0" font-size="13" fill="#1A1F24" text-anchor="start">電波で「音声その他の音響」を</text><text x="158" y="79.0" font-size="13" fill="#1A1F24" text-anchor="start">送り、又は受けるための通信設備</text><rect x="24" y="114" width="120" height="76" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="84.0" y="157.6" font-size="16" fill="#2F6DB5" text-anchor="middle" font-weight="700">無線電信</text><text x="158" y="148.0" font-size="13" fill="#1A1F24" text-anchor="start">電波で「符号」を送り、又は受ける</text><text x="158" y="167.0" font-size="13" fill="#1A1F24" text-anchor="start">ための通信設備</text><rect x="24" y="202" width="120" height="76" rx="8" fill="#FFF6E5" stroke="#1A1F24" stroke-width="2.5"/><text x="84.0" y="245.6" font-size="16" fill="#1A1F24" text-anchor="middle" font-weight="700">無線設備</text><text x="158" y="236.0" font-size="13" fill="#1A1F24" text-anchor="start">無線電信・無線電話その他電波を送り、</text><text x="158" y="255.0" font-size="13" fill="#1A1F24" text-anchor="start">又は受けるための「電気的設備」</text><rect x="24" y="290" width="120" height="76" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="84.0" y="333.6" font-size="16" fill="#F5B041" text-anchor="middle" font-weight="700">混信</text><text x="158" y="324.0" font-size="13" fill="#1A1F24" text-anchor="start">他の無線局の正常な業務の運行を</text><text x="158" y="343.0" font-size="13" fill="#1A1F24" text-anchor="start">「妨害」する電波の発射、輻射又は誘導</text></svg>