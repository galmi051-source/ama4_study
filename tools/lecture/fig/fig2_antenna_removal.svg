<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><line x1="100" y1="220" x2="100" y2="100" stroke="#1A1F24" stroke-width="3"/><line x1="86" y1="100" x2="114" y2="100" stroke="#1A1F24" stroke-width="3"/><line x1="91" y1="110" x2="109" y2="110" stroke="#1A1F24" stroke-width="3"/><line x1="30" y1="226" x2="170" y2="226" stroke="#1A1F24" stroke-width="3"/><line x1="60" y1="90" x2="140" y2="170" stroke="#C8463D" stroke-width="5"/><line x1="140" y1="90" x2="60" y2="170" stroke="#C8463D" stroke-width="5"/><text x="100" y="260" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">空中線を撤去</text><rect x="200" y="40" width="300" height="70" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="350.0" y="71.0" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">免許が効力を失った</text><text x="350.0" y="90.2" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">→ 遅滞なく 空中線を撤去</text><rect x="200" y="125" width="300" height="50" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="350.0" y="155.6" font-size="16" fill="#1A1F24" text-anchor="middle" font-weight="700">免許状は 1か月以内に返納</text><text x="350" y="210" font-size="15" fill="#66727F" text-anchor="middle" font-weight="700">撤去しない場面</text><text x="350" y="240" font-size="14" fill="#66727F" text-anchor="middle">✕ 運用の休止</text><text x="350" y="266" font-size="14" fill="#66727F" text-anchor="middle">✕ 運用の停止の命令</text><text x="350" y="292" font-size="14" fill="#66727F" text-anchor="middle">✕ 臨時の電波発射停止</text><text x="100" y="330" font-size="13" fill="#66727F" text-anchor="middle">（無線設備全部ではなく空中線だけ）</text></svg>