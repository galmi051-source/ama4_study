<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="40" width="150" height="50" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="105.0" y="71.3" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">AGC</text><text x="195" y="71" font-size="16" fill="#1A1F24" text-anchor="start">電波の強弱に関係なく出力を一定に</text><rect x="30" y="108" width="150" height="50" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="105.0" y="139.3" font-size="18" fill="#2F6DB5" text-anchor="middle" font-weight="700">スケルチ</text><text x="195" y="139" font-size="16" fill="#1A1F24" text-anchor="start">無信号時の「ザー」を消す</text><rect x="30" y="176" width="150" height="50" rx="8" fill="#FFF6E5" stroke="#1A1F24" stroke-width="2.5"/><text x="105.0" y="207.3" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">リミッタ</text><text x="195" y="207" font-size="16" fill="#1A1F24" text-anchor="start">FM の振幅をそろえて雑音を除く</text><rect x="30" y="244" width="150" height="50" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="105.0" y="275.3" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">周波数弁別器</text><text x="195" y="275" font-size="16" fill="#1A1F24" text-anchor="start">周波数の変化 → 振幅の変化（FM の検波）</text><rect x="30" y="312" width="150" height="50" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="105.0" y="343.3" font-size="18" fill="#2F6DB5" text-anchor="middle" font-weight="700">クラリファイヤ</text><text x="195" y="343" font-size="16" fill="#1A1F24" text-anchor="start">SSB の周波数を微調整して明りょう度↑</text><text x="260" y="385" font-size="17" fill="#66727F" text-anchor="middle">問題文のキーワードで回路名を選ぶ</text></svg>