<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="20" y="20" width="230" height="230" rx="8" fill="#fff" stroke="#F5B041" stroke-width="2.5"/><text x="135" y="50" font-size="22" fill="#F5B041" text-anchor="middle" font-weight="700">昼</text><circle cx="210" cy="48" r="16" fill="#F5B041"/><line x1="30" y1="100" x2="240" y2="100" stroke="#F5B041" stroke-width="6" stroke-dasharray="12,6"/><text x="135" y="90" font-size="14" fill="#F5B041" text-anchor="middle">電子密度 大</text><path d="M50 240 L 135 104 L 220 240" fill="none" stroke="#C8463D" stroke-width="3"/><text x="135" y="200" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">21MHz 反射</text><rect x="270" y="20" width="230" height="230" rx="8" fill="#1E2B38" stroke="#2F6DB5" stroke-width="2.5"/><text x="385" y="50" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">夜</text><line x1="280" y1="100" x2="490" y2="100" stroke="#2F6DB5" stroke-width="3" stroke-dasharray="12,6"/><text x="385" y="90" font-size="14" fill="#fff" text-anchor="middle">電子密度 小</text><line x1="330" y1="240" x2="380" y2="40" stroke="#fff" stroke-width="2"/><polygon points="380.0,40.0 382.2,53.8 371.6,51.2" fill="#fff"/><text x="430" y="170" font-size="13" fill="#fff" text-anchor="middle">21MHz</text><text x="430" y="188" font-size="13" fill="#fff" text-anchor="middle">突き抜け</text><path d="M300 240 L 385 106 L 470 240" fill="none" stroke="#F5B041" stroke-width="3"/><text x="385" y="230" font-size="13" fill="#F5B041" text-anchor="middle" font-weight="700">7MHz なら反射</text><rect x="20" y="270" width="480" height="100" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260" y="298" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">突き抜けの減衰：高い周波数ほど 小</text><text x="260" y="326" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">反射の減衰：高い周波数ほど 大</text><text x="260" y="354" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">夜は低い周波数へ（21MHz → 7MHz）</text></svg>