<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="120" y="110" width="260" height="60" rx="6" fill="#C9CFD6" stroke="#1A1F24" stroke-width="2"/><text x="250" y="146" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">鉄心（磁性体）</text><path d="M135 100 C 155 100 155 180 135 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M163 100 C 183 100 183 180 163 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M191 100 C 211 100 211 180 191 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M219 100 C 239 100 239 180 219 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M247 100 C 267 100 267 180 247 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M275 100 C 295 100 295 180 275 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M303 100 C 323 100 323 180 303 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M331 100 C 351 100 351 180 331 180" fill="none" stroke="#F5B041" stroke-width="4"/><path d="M359 100 C 379 100 379 180 359 180" fill="none" stroke="#F5B041" stroke-width="4"/><text x="100" y="146" font-size="26" fill="#C8463D" text-anchor="middle" font-weight="700">N</text><text x="400" y="146" font-size="26" fill="#2F6DB5" text-anchor="middle" font-weight="700">S</text><text x="250" y="70" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">磁界を強くする</text><circle cx="150" cy="225" r="13" fill="#2E9E62"/><polyline points="144,225 149,230 157,220" fill="none" stroke="#fff" stroke-width="3"/><text x="175" y="231" font-size="18" fill="#2E9E62" text-anchor="start" font-weight="700">巻数を多く</text><circle cx="150" cy="265" r="13" fill="#2E9E62"/><polyline points="144,265 149,270 157,260" fill="none" stroke="#fff" stroke-width="3"/><text x="175" y="271" font-size="18" fill="#2E9E62" text-anchor="start" font-weight="700">電流を大きく</text><circle cx="150" cy="305" r="13" fill="#2E9E62"/><polyline points="144,305 149,310 157,300" fill="none" stroke="#fff" stroke-width="3"/><text x="175" y="311" font-size="18" fill="#2E9E62" text-anchor="start" font-weight="700">鉄心を入れる</text><circle cx="150" cy="345" r="13" fill="#C8463D"/><line x1="144" y1="339" x2="156" y2="351" stroke="#fff" stroke-width="3"/><line x1="156" y1="339" x2="144" y2="351" stroke="#fff" stroke-width="3"/><text x="175" y="351" font-size="18" fill="#C8463D" text-anchor="start" font-weight="700">断面積を大きく</text><text x="390" y="270" font-size="15" fill="#66727F" text-anchor="middle">鉄心を入れると</text><text x="390" y="295" font-size="15" fill="#66727F" text-anchor="middle">インダクタンス</text><text x="390" y="322" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">大きくなる</text></svg>