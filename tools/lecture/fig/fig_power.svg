<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="260" y="50" font-size="30" fill="#1A1F24" text-anchor="middle" font-weight="700">P ＝ V × I</text><text x="260" y="95" font-size="20" fill="#66727F" text-anchor="middle">V ＝ I×R を代入 →　P ＝ I² × R</text><text x="260" y="125" font-size="20" fill="#66727F" text-anchor="middle">I ＝ V÷R を代入 →　P ＝ V² ÷ R</text><rect x="60" y="160" width="400" height="60" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260.0" y="197.0" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">電圧を求める：V² ＝ P × R → 平方根</text><text x="80" y="265" font-size="20" fill="#1A1F24" text-anchor="start">25Ω・100W</text><text x="230" y="265" font-size="20" fill="#C8463D" text-anchor="start" font-weight="700">→ 100×25 ＝ 2500 → √2500 ＝ 50V</text><text x="80" y="310" font-size="20" fill="#1A1F24" text-anchor="start">4Ω・100W</text><text x="230" y="310" font-size="20" fill="#C8463D" text-anchor="start" font-weight="700">→ 100×4 ＝ 400 → √400 ＝ 20V</text><text x="260" y="370" font-size="17" fill="#66727F" text-anchor="middle">よく出る平方根：√100=10 √400=20 √2500=50</text></svg>