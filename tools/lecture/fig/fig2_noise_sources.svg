<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="140" y="34" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">雑音を出す</text><text x="390" y="34" font-size="18" fill="#2E9E62" text-anchor="middle" font-weight="700">出さない</text><rect x="40" y="55" width="200" height="46" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="140.0" y="83.6" font-size="16" fill="#C8463D" text-anchor="middle">電気溶接機</text><rect x="40" y="113" width="200" height="46" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="140.0" y="141.6" font-size="16" fill="#C8463D" text-anchor="middle">高周波ミシン</text><rect x="40" y="171" width="200" height="46" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="140.0" y="199.6" font-size="16" fill="#C8463D" text-anchor="middle">自動車の点火栓</text><rect x="290" y="55" width="200" height="46" rx="8" fill="#EAF6EE" stroke="#2E9E62" stroke-width="2.5"/><text x="390.0" y="84.3" font-size="18" fill="#2E9E62" text-anchor="middle" font-weight="700">電波時計</text><text x="390" y="125" font-size="13" fill="#66727F" text-anchor="middle">電波を受けるだけ</text><text x="260" y="260" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">BCI の原因：過変調・寄生振動・送電線に接近</text><text x="260" y="290" font-size="15" fill="#C8463D" text-anchor="middle">✕ アンテナ結合回路の結合度が疎</text><rect x="30" y="315" width="460" height="50" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260.0" y="344.9" font-size="14" fill="#1A1F24" text-anchor="middle">障害を与えるおそれが最も低い ＝ 送信電力が低下したとき</text></svg>