<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="24" y="26" width="150" height="62" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="99.0" y="62.6" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">あらかじめ許可</text><text x="188" y="62.0" font-size="13" fill="#1A1F24" text-anchor="start">設備の変更の工事・設置場所の変更</text><rect x="24" y="100" width="150" height="62" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="99.0" y="136.6" font-size="16" fill="#2F6DB5" text-anchor="middle" font-weight="700">申請</text><text x="188" y="127.0" font-size="13" fill="#1A1F24" text-anchor="start">指定事項の変更</text><text x="188" y="146.0" font-size="13" fill="#1A1F24" text-anchor="start">（呼出符号・電波の型式・周波数・空中線電力）</text><rect x="24" y="174" width="150" height="62" rx="8" fill="#FFF6E5" stroke="#2E9E62" stroke-width="2.5"/><text x="99.0" y="210.6" font-size="16" fill="#2E9E62" text-anchor="middle" font-weight="700">届出</text><text x="188" y="210.0" font-size="13" fill="#1A1F24" text-anchor="start">無線局の廃止</text><rect x="24" y="248" width="150" height="62" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="99.0" y="284.6" font-size="16" fill="#F5B041" text-anchor="middle" font-weight="700">訂正</text><text x="188" y="284.0" font-size="13" fill="#1A1F24" text-anchor="start">免許状の記載事項に変更を生じたとき</text><text x="260" y="330" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">開設するとき ＝ 免許の申請書を提出</text><text x="260" y="362" font-size="13" fill="#66727F" text-anchor="middle">いじる・動かす → 許可／もらい直す → 申請／やめる → 届出</text></svg>