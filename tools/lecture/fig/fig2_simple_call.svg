<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="260" y="30" font-size="16" fill="#1A1F24" text-anchor="middle" font-weight="700">10W・確実に連絡できるとき</text><rect x="20" y="45" width="230" height="75" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="135.0" y="79.0" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">呼出し</text><text x="135.0" y="95.8" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">相手局の呼出符号 3回以下</text><rect x="270" y="45" width="230" height="75" rx="8" fill="#EAF6EE" stroke="#2E9E62" stroke-width="2.5"/><text x="385.0" y="79.0" font-size="14" fill="#2E9E62" text-anchor="middle" font-weight="700">応答</text><text x="385.0" y="95.8" font-size="14" fill="#2E9E62" text-anchor="middle" font-weight="700">こちらは＋自局 1回</text><rect x="20" y="140" width="480" height="70" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260.0" y="171.5" font-size="14" fill="#1A1F24" text-anchor="middle">試験の前：ただいま試験中 3回・こちらは 1回・自局 3回</text><text x="260.0" y="188.3" font-size="14" fill="#1A1F24" text-anchor="middle">試験中：他の無線局から停止の要求がないか聴守</text><rect x="20" y="230" width="480" height="60" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="260.0" y="256.5" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">「非常」の呼出しを受信</text><text x="260.0" y="273.3" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">→ 混信を与えるおそれのある電波を止めて傍受</text><rect x="20" y="305" width="480" height="55" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="260.0" y="337.75" font-size="15" fill="#1A1F24" text-anchor="middle" font-weight="700">有線が復旧 → 速やかに非常通信の取扱いを停止</text></svg>