<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="24" y="30" width="150" height="84" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="99.0" y="77.6" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">発振回路の方式</text><text x="188" y="68.0" font-size="14" fill="#1A1F24" text-anchor="start">外囲の「温度若しくは湿度」の変化に</text><text x="188" y="87.0" font-size="14" fill="#1A1F24" text-anchor="start">影響を受けない</text><rect x="24" y="130" width="150" height="84" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="99.0" y="177.6" font-size="16" fill="#2F6DB5" text-anchor="middle" font-weight="700">送信装置</text><text x="188" y="168.0" font-size="14" fill="#1A1F24" text-anchor="start">「電源電圧又は負荷」の変化で</text><text x="188" y="187.0" font-size="14" fill="#1A1F24" text-anchor="start">「発振周波数」に影響を与えない</text><rect x="24" y="230" width="150" height="84" rx="8" fill="#FFF6E5" stroke="#2E9E62" stroke-width="2.5"/><text x="99.0" y="277.6" font-size="16" fill="#2E9E62" text-anchor="middle" font-weight="700">移動する局</text><text x="188" y="268.0" font-size="14" fill="#1A1F24" text-anchor="start">実際上起こり得る「振動又は衝撃」</text><text x="188" y="287.0" font-size="14" fill="#1A1F24" text-anchor="start">によっても周波数を維持</text><rect x="30" y="335" width="460" height="45" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260.0" y="362.4" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">回路 ＝ 温度湿度／装置 ＝ 電源と負荷／移動 ＝ 揺れ</text></svg>