<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><line x1="60" y1="200" x2="460" y2="200" stroke="#1A1F24" stroke-width="4"/><line x1="120" y1="100" x2="120" y2="300" stroke="#C8463D" stroke-width="8"/><text x="120" y="330" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">反射器</text><text x="120" y="352" font-size="16" fill="#C8463D" text-anchor="middle">長い</text><line x1="240" y1="120" x2="240" y2="280" stroke="#1A1F24" stroke-width="8"/><text x="240" y="330" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">放射器</text><text x="240" y="352" font-size="14" fill="#66727F" text-anchor="middle">（給電）</text><line x1="340" y1="135" x2="340" y2="265" stroke="#2F6DB5" stroke-width="8"/><text x="340" y="330" font-size="18" fill="#2F6DB5" text-anchor="middle" font-weight="700">導波器</text><text x="340" y="352" font-size="16" fill="#2F6DB5" text-anchor="middle">短い</text><line x1="420" y1="140" x2="420" y2="260" stroke="#2F6DB5" stroke-width="8"/><text x="420" y="330" font-size="16" fill="#2F6DB5" text-anchor="middle">導波器</text><line x1="300" y1="60" x2="490" y2="60" stroke="#2E9E62" stroke-width="5"/><polygon points="490.0,60.0 477.1,65.5 477.1,54.5" fill="#2E9E62"/><text x="395" y="45" font-size="17" fill="#2E9E62" text-anchor="middle" font-weight="700">電波はこっちに強く出る</text><text x="260" y="390" font-size="22" fill="#C8463D" text-anchor="middle" font-weight="700">「長く反射、短く導く」</text></svg>