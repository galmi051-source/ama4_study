<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="40" y="60" width="120" height="70" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="100.0" y="91.0" font-size="16" fill="#1A1F24" text-anchor="middle">水晶</text><text x="100.0" y="110.2" font-size="16" fill="#1A1F24" text-anchor="middle">発振器</text><line x1="160" y1="95.0" x2="200" y2="95.0" stroke="#1A1F24" stroke-width="2"/><polygon points="200.0,95.0 187.1,100.5 187.1,89.5" fill="#1A1F24"/><rect x="200" y="60" width="120" height="70" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="260.0" y="91.0" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">緩衝</text><text x="260.0" y="110.2" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">増幅器</text><line x1="320" y1="95.0" x2="360" y2="95.0" stroke="#1A1F24" stroke-width="2"/><polygon points="360.0,95.0 347.1,100.5 347.1,89.5" fill="#1A1F24"/><rect x="360" y="60" width="120" height="70" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="420.0" y="91.0" font-size="16" fill="#1A1F24" text-anchor="middle">逓倍器</text><text x="420.0" y="110.2" font-size="16" fill="#1A1F24" text-anchor="middle">など</text><text x="220" y="155" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">結合は「疎」</text><text x="260" y="200" font-size="17" fill="#1A1F24" text-anchor="middle" font-weight="700">周波数が変動する原因</text><rect x="30" y="220" width="145" height="46" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="102.5" y="248.25" font-size="15" fill="#C8463D" text-anchor="middle">負荷の変動</text><rect x="188" y="220" width="145" height="46" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="260.5" y="248.25" font-size="15" fill="#C8463D" text-anchor="middle">電源電圧の変動</text><rect x="346" y="220" width="145" height="46" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="418.5" y="248.25" font-