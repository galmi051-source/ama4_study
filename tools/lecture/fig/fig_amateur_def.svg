<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="260" y="40" font-size="22" fill="#1A1F24" text-anchor="middle" font-weight="700">アマチュア業務の定義</text><text x="260" y="85" font-size="22" fill="#C8463D" text-anchor="middle" font-weight="700">金銭上の利益のためでなく</text><text x="260" y="120" font-size="19" fill="#1A1F24" text-anchor="middle">もっぱら 個人的な無線技術の興味 によって行う</text><rect x="35" y="160" width="130" height="60" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="100.0" y="197.0" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">自己訓練</text><text x="182" y="197" font-size="22" fill="#1A1F24" text-anchor="middle">＋</text><rect x="195" y="160" width="130" height="60" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260.0" y="197.0" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">通　信</text><text x="342" y="197" font-size="22" fill="#1A1F24" text-anchor="middle">＋</text><rect x="355" y="160" width="130" height="60" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="420.0" y="197.0" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">技術的研究</text><text x="260" y="260" font-size="20" fill="#1A1F24" text-anchor="middle">の業務</text><text x="260" y="310" font-size="18" fill="#C8463D" text-anchor="middle">3 点セット。穴埋めは「技術的研究」</text><text x="260" y="350" font-size="15" fill="#66727F" text-anchor="middle">✕ 公共の福祉（→ 電波法の目的）　✕ 災害の救援　✕ 放送</text></svg>