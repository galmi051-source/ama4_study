<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="260" y="40" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">電波法に違反したとき</text><rect x="40" y="70" width="200" height="110" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="140.0" y="120.0" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">運用の停止</text><text x="140.0" y="144.0" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">3 か月以内</text><rect x="280" y="70" width="200" height="110" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="380.0" y="121.0" font-size="16" fill="#1A1F24" text-anchor="middle">運用時間・周波数</text><text x="380.0" y="140.2" font-size="16" fill="#1A1F24" text-anchor="middle">空中線電力の制限</text><text x="260" y="215" font-size="15" fill="#66727F" text-anchor="middle">無線従事者の業務従事停止も 3 か月以内</text><rect x="40" y="250" width="440" height="60" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="260.0" y="285.95" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">不正な手段で免許を受けた → 免許の取消し</text><text x="260" y="350" font-size="14" fill="#66727F" text-anchor="middle">✕ 従事者の解任命令　✕ 相手方の制限　✕ 電波の型式の制限</text></svg>