<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="30" width="180" height="220" rx="6" fill="#fff" stroke="#1A1F24" stroke-width="3"/><text x="120" y="64" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">免許状</text><text x="120" y="105" font-size="15" fill="#2F6DB5" text-anchor="middle" font-weight="700">呼出符号</text><text x="120" y="139" font-size="15" fill="#2F6DB5" text-anchor="middle" font-weight="700">電波の型式</text><text x="120" y="173" font-size="15" fill="#2F6DB5" text-anchor="middle" font-weight="700">周波数</text><text x="120" y="207" font-size="15" fill="#2F6DB5" text-anchor="middle" font-weight="700">設置場所</text><text x="330" y="70" font-size="15" fill="#1A1F24" text-anchor="middle">運用はすべて</text><text x="330" y="98" font-size="19" fill="#2F6DB5" text-anchor="middle" font-weight="700">免許状のとおり</text><rect x="240" y="125" width="260" height="75" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="370.0" y="158.5" font-size="16" fill="#1A1F24" text-anchor="middle" font-weight="700">空中線電力は</text><text x="370.0" y="177.7" font-size="16" fill="#1A1F24" text-anchor="middle" font-weight="700">範囲内で 必要最小</text><text x="370" y="222" font-size="13" fill="#C8463D" text-anchor="middle">（「適当なもの」は ✕）</text><rect x="30" y="280" width="460" height="80" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="260.0" y="316.0" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">範囲を超えて運用できる ＝ 非常通信</text><text x="260.0" y="335.2" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">（遭難・緊急・安全通信も）</text></svg>