<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="130" y="34" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">1か月以内に返納</text><text x="390" y="34" font-size="18" fill="#66727F" text-anchor="middle" font-weight="700">返納しない</text><line x1="260" y1="20" x2="260" y2="330" stroke="#D9DEE3" stroke-width="2"/><rect x="30" y="60" width="200" height="52" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="130.0" y="91.95" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">免許の取消し</text><rect x="30" y="130" width="200" height="52" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="130.0" y="161.95" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">無線局の廃止</text><rect x="30" y="200" width="200" height="52" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="130.0" y="231.95" font-size="17" fill="#C8463D" text-anchor="middle" font-weight="700">有効期間の満了</text><rect x="290" y="60" width="200" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="390.0" y="87.25" font-size="15" fill="#66727F" text-anchor="middle">臨時の電波発射停止</text><rect x="290" y="120" width="200" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="390.0" y="147.25" font-size="15" fill="#66727F" text-anchor="middle">運用の停止</text><rect x="290" y="180" width="200" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="390.0" y="207.25" font-size="15" fill="#66727F" text-anchor="middle">運用の休止</text><rect x="290" y="240" width="200" height="44" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="390.0" y="267.25" font-size="15" fill="#66727F" text-anchor="middle">住所の変更</text><text x="130" y="300" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">＝ 免許が効力を失った</text><text x="390" y="320" font-size="13" fill="#66727F" text-anchor="middle">（免許はまだ生きている）</text