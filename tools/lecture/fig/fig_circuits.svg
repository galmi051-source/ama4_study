<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="90" y="45" font-size="20" fill="#66727F" text-anchor="middle">送信側</text><text x="430" y="45" font-size="20" fill="#66727F" text-anchor="middle">受信側</text><rect x="30" y="70" width="120" height="60" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="90.0" y="107.0" font-size="20" fill="#1A1F24" text-anchor="middle">音声</text><line x1="150" y1="100" x2="190" y2="100" stroke="#1A1F24" stroke-width="3"/><polygon points="190.0,100.0 177.1,105.5 177.1,94.5" fill="#1A1F24"/><rect x="190" y="70" width="120" height="60" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="250.0" y="107.0" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">変調回路</text><line x1="310" y1="100" x2="350" y2="100" stroke="#1A1F24" stroke-width="3"/><polygon points="350.0,100.0 337.1,105.5 337.1,94.5" fill="#1A1F24"/><text x="330" y="90" font-size="12" fill="#1A1F24" text-anchor="middle"></text><rect x="350" y="70" width="140" height="60" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="420.0" y="106.3" font-size="18" fill="#1A1F24" text-anchor="middle">電波（変調波）</text><text x="250" y="160" font-size="18" fill="#66727F" text-anchor="middle">搬送波に信号を乗せる</text><rect x="350" y="220" width="140" height="60" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="420.0" y="256.3" font-size="18" fill="#1A1F24" text-anchor="middle">電波（変調波）</text><line x1="350" y1="250" x2="310" y2="250" stroke="#1A1F24" stroke-width="3"/><polygon points="310.0,250.0 322.9,244.5 322.9,255.5" fill="#1A1F24"/><rect x="190" y="220" width="120" height="60" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="250.0" y="257.0" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">検波回路</text><line x1="190" y1="250" x2="150" y2="250" stroke="#1A1F24" stroke-width="3"/><polygon points="150.0,250.0 162.9,244.5 162.9,255.5" fill="#1A1F24"/><rect x="30" y="220" width="120" height="60" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="90.0" y="257.0" font-size="20" fill="#1A1F24" text-anchor="middle">音声</text><text x="250" y="310" font-size="18" fill="#66727F" text-anchor="middle">変調波から信号を取り出す（復調）</text><text x="260" y="370" font-size="22" fill="#C8463D" text-anchor="middle" font-weight="700">乗せるのが変調、取り出すのが検波</text></svg>