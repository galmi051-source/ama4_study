<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="20" y="30" width="230" height="110" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="135" y="60" font-size="16" fill="#2F6DB5" text-anchor="middle" font-weight="700">呼出符号が不確実</text><text x="135" y="92" font-size="16" fill="#1A1F24" text-anchor="middle">「誰かこちらを</text><text x="135" y="118" font-size="16" fill="#1A1F24" text-anchor="middle">呼びましたか」で応答</text><rect x="270" y="30" width="230" height="110" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="385" y="60" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">自局宛てか不確実</text><text x="385" y="92" font-size="16" fill="#1A1F24" text-anchor="middle">確実に分かるまで</text><text x="385" y="118" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">応答しない</text><rect x="24" y="165" width="150" height="56" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="99.0" y="197.9" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">混信の通知</text><text x="188" y="198.0" font-size="13" fill="#1A1F24" text-anchor="start">直ちに呼出しを中止</text><rect x="24" y="231" width="150" height="56" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="99.0" y="263.9" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">周波数変更の要求</text><text x="188" y="264.0" font-size="13" fill="#1A1F24" text-anchor="start">「了解」又は「OK」→ 直ちに変更</text><rect x="24" y="297" width="150" height="56" rx="8" fill="#FFF6E5" stroke="#1A1F24" stroke-width="2.5"/><text x="99.0" y="329.9" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">一括呼出し</text><text x="188" y="330.0" font-size="13" fill="#1A1F24" text-anchor="start">各局 3回・こちらは 1回・自局 3回以下</text></svg>