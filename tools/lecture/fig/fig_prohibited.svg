<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="40" width="130" height="56" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="95.0" y="73.6" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">秘密の保護</text><text x="175" y="74" font-size="13" fill="#1A1F24" text-anchor="start">特定の相手方への通信を傍受して 漏らす・窃用 ✕（聞くこと自体は ✕ではない）</text><rect x="30" y="120" width="130" height="56" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="95.0" y="153.6" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">暗語</text><text x="175" y="154" font-size="13" fill="#1A1F24" text-anchor="start">使ってはならない（略語・Q符号・通話表は OK）</text><rect x="30" y="200" width="130" height="56" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="95.0" y="233.6" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">他人の依頼</text><text x="175" y="234" font-size="13" fill="#1A1F24" text-anchor="start">頼まれた通報は送信できない（非常時の救助・救援用は例外）</text><rect x="30" y="280" width="130" height="56" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="95.0" y="313.6" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">放送に支障</text><text x="175" y="314" font-size="13" fill="#1A1F24" text-anchor="start">テレビ・ラジオに支障 → 速やかにその周波数での発射を中止</text></svg>