<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="30" width="200" height="130" rx="10" fill="#fff" stroke="#1A1F24" stroke-width="3"/><text x="130" y="60" font-size="14" fill="#1A1F24" text-anchor="middle" font-weight="700">無線従事者免許証</text><rect x="50" y="78" width="50" height="62" fill="#D9DEE3"/><text x="160" y="100" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">氏名</text><text x="160" y="125" font-size="13" fill="#66727F" text-anchor="middle">資格</text><rect x="250" y="20" width="100" height="62" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="300.0" y="55.9" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">訂正</text><text x="364" y="56.0" font-size="12" fill="#1A1F24" text-anchor="start">氏名が変わったとき</text><rect x="250" y="94" width="100" height="62" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="300.0" y="129.9" font-size="14" fill="#F5B041" text-anchor="middle" font-weight="700">再交付</text><text x="364" y="121.0" font-size="12" fill="#1A1F24" text-anchor="start">汚した・破った・失った</text><text x="364" y="140.0" font-size="12" fill="#1A1F24" text-anchor="start">→ 免許証と写真1枚</text><rect x="250" y="168" width="100" height="62" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="300.0" y="203.9" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">返納 10日</text><text x="364" y="195.0" font-size="12" fill="#1A1F24" text-anchor="start">取消し・再交付後に発見・</text><text x="364" y="214.0" font-size="12" fill="#1A1F24" text-anchor="start">死亡／失そう</text><rect x="30" y="250" width="460" height="50" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="260.0" y="280.6" font-size="16" fill="#2F6DB5" text-anchor="middle" font-weight="700">業務中は 携帯（掲示・保管ではない）</text><rect x="30" y="315" width="460" height="55" rx="8" fill="#fff" stroke="#66727F" stroke-width="2.5"/><text x="260.0" y="347.75" font-size="15" fill="#66727F" text-anchor="middle">有効期間はない → 5年たっても何もしない</text></svg>