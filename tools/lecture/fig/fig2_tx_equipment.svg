<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><rect x="30" y="60" width="180" height="80" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="120.0" y="107.0" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">送信装置</text><text x="240" y="108" font-size="26" fill="#1A1F24" text-anchor="middle" font-weight="700">＋</text><rect x="270" y="60" width="220" height="80" rx="8" fill="#EEF3FA" stroke="#2F6DB5" stroke-width="2.5"/><text x="380.0" y="107.0" font-size="20" fill="#2F6DB5" text-anchor="middle" font-weight="700">送信空中線系</text><path d="M30 160 L 30 175 L 490 175 L 490 160" fill="none" stroke="#1A1F24" stroke-width="2"/><text x="260" y="205" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">＝ 送信設備（電波を送る設備）</text><rect x="30" y="240" width="460" height="120" rx="8" fill="#fff" stroke="#2F6DB5" stroke-width="2.5"/><text x="260" y="272" font-size="15" fill="#2F6DB5" text-anchor="middle" font-weight="700">送信空中線系とは</text><text x="260" y="302" font-size="15" fill="#1A1F24" text-anchor="middle">送信装置の発生する「高周波エネルギー」を</text><text x="260" y="330" font-size="15" fill="#1A1F24" text-anchor="middle">空間へふく射する装置</text></svg>