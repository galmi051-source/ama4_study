<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="130" y="40" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">ディップメータ</text><rect x="40" y="60" width="110" height="70" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="95.0" y="101.3" font-size="18" fill="#1A1F24" text-anchor="middle">メータ</text><path d="M160 95 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0" fill="none" stroke="#1A1F24" stroke-width="2.5"/><text x="200" y="75" font-size="14" fill="#66727F" text-anchor="middle">コイル</text><path d="M250 95 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0" fill="none" stroke="#1A1F24" stroke-width="2.5"/><line x1="296" y1="81" x2="296" y2="109" stroke="#1A1F24" stroke-width="4"/><line x1="304" y1="81" x2="304" y2="109" stroke="#1A1F24" stroke-width="4"/><line x1="250" y1="95" x2="250" y2="140" stroke="#1A1F24" stroke-width="3"/><line x1="322" y1="95" x2="322" y2="140" stroke="#1A1F24" stroke-width="3"/><line x1="250" y1="140" x2="322" y2="140" stroke="#1A1F24" stroke-width="3"/><line x1="300" y1="81" x2="300" y2="95" stroke="#1A1F24" stroke-width="3"/><line x1="300" y1="95" x2="300" y2="109" stroke="#1A1F24" stroke-width="3"/><text x="290" y="170" font-size="15" fill="#66727F" text-anchor="middle">調べたい同調回路</text><text x="130" y="190" font-size="15" fill="#66727F" text-anchor="middle">近づけて周波数を変える →</text><text x="130" y="212" font-size="15" fill="#C8463D" text-anchor="middle" font-weight="700">共振周波数で針がディップ（下がる）</text><text x="390" y="40" font-size="20" fill="#1A1F24" text-anchor="middle" font-weight="700">擬似負荷（ダミーロード）</text><rect x="340" y="230" width="110" height="60" rx="8" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="395.0" y="266.3" font-size="18" fill="#1A1F24" text-anchor="middle">送信機</text><line x1="450" y1="260" x2="470" y2="260" stroke="#1A1F24" stroke-width="3"/><rect x="470" y="250" width="40" height="20" fill="#fff" stroke="#1A1F24" stroke-width="2.5"/><text x="490" y="240" font-size="14" fill="#66727F" text-anchor="middle">抵抗</text><line x1="455" y1="250" x2="455" y2="250" stroke="#1A1F24" stroke-width="3"/><text x="430" y="320" font-size="16" fill="#66727F" text-anchor="middle">アンテナの代わりにつなぐ</text><text x="430" y="345" font-size="16" fill="#C8463D" text-anchor="middle" font-weight="700">→ 電波を出さずに調整できる</text><line x1="380" y1="150" x2="440" y2="210" stroke="#C8463D" stroke-width="4"/><line x1="440" y1="150" x2="380" y2="210" stroke="#C8463D" stroke-width="4"/><line x1="410" y1="200" x2="410" y2="160" stroke="#1A1F24" stroke-width="3"/><line x1="395" y1="160" x2="425" y2="160" stroke="#1A1F24" stroke-width="3"/></svg>