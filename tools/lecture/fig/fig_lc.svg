<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><line x1="60" y1="320" x2="480" y2="320" stroke="#1A1F24" stroke-width="3"/><line x1="60" y1="60" x2="60" y2="330" stroke="#1A1F24" stroke-width="3"/><text x="470" y="350" font-size="16" fill="#66727F" text-anchor="middle">周波数 →</text><text x="60" y="45" font-size="16" fill="#66727F" text-anchor="start">電流の通しやすさ</text><path d="M70 300 C 150 120 300 80 470 70" fill="none" stroke="#2F6DB5" stroke-width="4"/><text x="330" y="120" font-size="20" fill="#2F6DB5" text-anchor="middle" font-weight="700">コンデンサ</text><text x="330" y="145" font-size="16" fill="#2F6DB5" text-anchor="middle">高い周波数ほど通す</text><path d="M70 80 C 150 260 300 300 470 310" fill="none" stroke="#C8463D" stroke-width="4"/><text x="330" y="260" font-size="20" fill="#C8463D" text-anchor="middle" font-weight="700">コイル</text><text x="330" y="285" font-size="16" fill="#C8463D" text-anchor="middle">高い周波数ほど通さない</text><line x1="96" y1="66" x2="124" y2="66" stroke="#1A1F24" stroke-width="4"/><line x1="96" y1="74" x2="124" y2="74" stroke="#1A1F24" stroke-width="4"/><text x="150" y="76" font-size="15" fill="#2F6DB5" text-anchor="start">直流は通さない</text><path d="M90 215 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0" fill="none" stroke="#1A1F24" stroke-width="2.5"/><text x="260" y="385" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">コンデンサは高い周波数に強い、コイルは弱い</text></svg>