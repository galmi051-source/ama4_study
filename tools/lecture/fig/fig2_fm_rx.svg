2"/><polygon points="325.0,170.0 319.5,157.1 330.5,157.1" fill="#1A1F24"/><line x1="380" y1="195" x2="430" y2="120" stroke="#1A1F24" stroke-width="2"/><polygon points="430.0,120.0 427.4,133.8 418.3,127.7" fill="#1A1F24"/><rect x="24" y="245" width="120" height="40" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="84.0" y="269.9" font-size="14" fill="#2F6DB5" text-anchor="middle" font-weight="700">振幅制限器</text><text x="158" y="270.0" font-size="13" fill="#1A1F24" text-anchor="start">振幅を一定に → 振幅変調成分（雑音）を除く</text><rect x="24" y="293" width="120" height="40" rx="8" fill="#FFF6E5" stroke="#C8463D" stroke-width="2.5"/><text x="84.0" y="317.9" font-size="14" fill="#C8463D" text-anchor="middle" font-weight="700">周波数弁別器</text><text x="158" y="318.0" font-size="13" fill="#1A1F24" text-anchor="start">周波数の変化 → 振幅の変化（FM の復調）</text><rect x="24" y="341" width="120" height="40" rx="8" fill="#FFF6E5" stroke="#2E9E62" stroke-width="2.5"/><text x="84.0" y="365.9" font-size="14" fill="#2E9E62" text-anchor="middle" font-weight="700">スケルチ</text><text x="158" y="366.0" font-size="13" fill="#1A1F24" text-anchor="start">電波がないときの雑音を消す</text></svg>