" stroke-width="2.5"/><text x="257.0" y="228" font-size="14" fill="#1A1F24" text-anchor="middle">こちらは</text><text x="257.0" y="252" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">1 回</text><line x1="332" y1="233" x2="344" y2="233" stroke="#66727F" stroke-width="2"/><polygon points="344.0,233.0 331.1,238.5 331.1,227.5" fill="#66727F"/><rect x="344" y="205" width="150" height="56" rx="8" fill="#FFF6E5" stroke="#2F6DB5" stroke-width="2.5"/><text x="419.0" y="228" font-size="14" fill="#1A1F24" text-anchor="middle">自局の呼出符号</text><text x="419.0" y="252" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">1 回</text><text x="260" y="330" font-size="18" fill="#C8463D" text-anchor="middle" font-weight="700">違いは最後の自局：呼出し 3 回以下 ／ 応答 1 回</text><text x="260" y="365" font-size="15" fill="#66727F" text-anchor="middle">順番はどちらも「相手が先、自分が後」</text></svg>