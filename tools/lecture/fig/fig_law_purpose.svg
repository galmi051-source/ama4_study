<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="260" y="40" font-size="22" fill="#1A1F24" text-anchor="middle" font-weight="700">電波法 第1条（目的）</text><rect x="40" y="70" width="440" height="120" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260" y="105" font-size="20" fill="#1A1F24" text-anchor="middle">電波の</text><text x="260" y="135" font-size="26" fill="#C8463D" text-anchor="middle" font-weight="700">公平かつ能率的な利用</text><text x="260" y="170" font-size="18" fill="#1A1F24" text-anchor="middle">を確保することによって</text><rect x="40" y="210" width="440" height="70" rx="8" fill="#FFF6E5" stroke="#F5B041" stroke-width="2.5"/><text x="260" y="240" font-size="26" fill="#C8463D" text-anchor="middle" font-weight="700">公共の福祉を増進</text><text x="260" y="268" font-size="16" fill="#1A1F24" text-anchor="middle">することを目的とする</text><text x="260" y="320" font-size="17" fill="#66727F" text-anchor="middle">✕ 有効な利用　✕ 電気通信事業の発展</text><text x="260" y="348" font-size="17" fill="#66727F" text-anchor="middle">✕ 通信の秘密　✕ 無線技術の向上</text><text x="260" y="385" font-size="17" fill="#C8463D" text-anchor="middle">キーワード 2 つがそろった選択肢を選ぶ</text></svg>