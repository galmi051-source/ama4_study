<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Yu Gothic UI, Meiryo, sans-serif"><text x="260" y="34" font-size="18" fill="#1A1F24" text-anchor="middle" font-weight="700">影像混信を減らす方法</text><circle cx="50" cy="70" r="13" fill="#2E9E62"/><polyline points="44,70 49,75 57,65" fill="none" stroke="#fff" stroke-width="3"/><text x="75" y="76" font-size="16" fill="#2E9E62" text-anchor="start">中間周波数を高くする</text><circle cx="50" cy="112" r="13" fill="#2E9E62"/><polyline points="44,112 49,117 57,107" fill="none" stroke="#fff" stroke-width="3"/><text x="75" y="118" font-size="16" fill="#2E9E62" text-anchor="start">高周波増幅部の選択度を高くする</text><circle cx="50" cy="154" r="13" fill="#2E9E62"/><polyline points="44,154 49,159 57,149" fill="none" stroke="#fff" stroke-width="3"/><text x="75" y="160" font-size="16" fill="#2E9E62" text-anchor="start">アンテナにウェーブトラップを入れる</text><circle cx="50" cy="196" r="13" fill="#C8463D"/><line x1="44" y1="190" x2="56" y2="202" stroke="#fff" stroke-width="3"/><line x1="56" y1="190" x2="44" y2="202" stroke="#fff" stroke-width="3"/><text x="75" y="202" font-size="16" fill="#C8463D" text-anchor="start" font-weight="700">中間周波増幅部の利得を下げる</text><text x="260" y="260" font-size="16" fill="#1A1F24" text-anchor="middle" font-weight="700">高周波増幅部があると</text><text x="260" y="290" font-size="16" fill="#2E9E62" text-anchor="middle" font-weight="700">感度↑・影像混信↓・S/N↑</text><rect x="30" y="310" width="460" height="60" rx="8" fill="#FDECEA" stroke="#C8463D" stroke-width="2.5"/><text x="260.0" y="336.5" font-size="14" fill="#C8463D" text-anchor="middle">✕「局部発振器の出力が空中線から放射されやすい」</text><text x="260.0" y="353.3" font-size="14" fill="#C8463D" text-anchor="middle">（実際は放射されにくくなる）</text></svg>